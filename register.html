    <textarea id="data-2" data-filename="User.java" style="display:none;">package com.hajwma.user_management.entity;

import jakarta.persistence.*;
import jakarta.validation.constraints.NotBlank;
import jakarta.validation.constraints.Pattern;

@Entity @Table(name="users")
public class User {

    @Id
    @NotBlank(message = "Username is required")
    private String username;

    @NotBlank(message = "Email is required")
    @Pattern(regexp = "^.+@.+\\..+$", message = "Enter a valid email")
    private String email;

    @NotBlank(message = "Full Name is required")
    private String fullName;

    private String password;

    private String address;

    public String getUsername() { return username; }
    public void setUsername(String username) { this.username = username; }

    public String getEmail() { return email; }
    public void setEmail(String email) { this.email = email; }

    public String getFullName() { return fullName; }
    public void setFullName(String fullName) { this.fullName = fullName; }

    public String getPassword() { return password; }
    public void setPassword(String password) { this.password = password; }

    public String getAddress() { return address; }
    public void setAddress(String address) { this.address = address; }
}</textarea>

    <textarea id="data-4" data-filename="AppController.java" style="display:none;">package com.hajwma.user_management.controller;

import com.hajwma.user_management.entity.User;
import jakarta.servlet.http.HttpSession;
import jakarta.validation.Valid;
import org.springframework.beans.factory.annotation.Autowired;
import org.springframework.stereotype.Controller;
import org.springframework.ui.Model;
import org.springframework.validation.BindingResult;
import org.springframework.web.bind.annotation.*;
import com.hajwma.user_management.repository.UserRepository;

@Controller
public class AppController {

    @Autowired UserRepository repo;

    @GetMapping("/")
    public String regPage(Model m) {
        m.addAttribute("user", new User());
        return "register";
    }

    @PostMapping("/register")
    public String register(@Valid @ModelAttribute("user") User user, BindingResult res) {

        if (user.getUsername() != null && repo.existsById(user.getUsername())) {
            res.rejectValue("username", "error.username", "Username already exists!");
        }

        if(user.getPassword() == null || user.getPassword().length() < 6) {
            res.rejectValue("password", "error.password", "Password must be at least 6 characters");
        }

        if(res.hasErrors()) return "register";

        repo.save(user);
        return "redirect:/login";
    }

    @GetMapping("/login")
    public String logPage() { return "login"; }

    @PostMapping("/login")
    public String login(@RequestParam String id, @RequestParam String pass, HttpSession session, Model m) {
        User u = repo.findByUsernameOrEmail(id, id).orElse(null);
        if(u != null && u.getPassword().equals(pass)) {
            session.setAttribute("user", u);
            return "redirect:/dashboard";
        }
        m.addAttribute("error", "Invalid credentials!");
        return "login";
    }
    @GetMapping("/logout")
    public String logout(HttpSession session) {
        session.invalidate();
        return "redirect:/login";
    }

    @GetMapping("/dashboard")
    public String dash(Model m) {
        m.addAttribute("users", repo.findAll());
        return "dashboard";
    }
    @PostMapping("/add")
    public String add(@ModelAttribute User u) {
        repo.save(u);
        return "redirect:/dashboard";
    }

    @GetMapping("/delete/{username}")
    public String del(@PathVariable String username) {
        repo.deleteById(username);
        return "redirect:/dashboard";
    }

    @GetMapping("/edit/{username}")
    public String edit(@PathVariable String username, Model m) {
        m.addAttribute("user", repo.findById(username).orElse(null));
        return "edit";
    }

    @PostMapping("/update")
    public String update(@Valid @ModelAttribute("user") User u, BindingResult res) {
        if (!u.getPassword().isEmpty() && u.getPassword().length() < 6) {
            res.rejectValue("password", "error.password", "Password must be at least 6 characters");
        }
        if (res.hasErrors()) {
            return "edit";
        }

        User existing = repo.findById(u.getUsername()).orElse(null);
        if (u.getPassword().isEmpty()) {
            u.setPassword(existing.getPassword());
        }

        repo.save(u);
        return "redirect:/dashboard";
    }
}</textarea>

    <script>
        let toastTimeout;

        function showToast(filename) {
            const toast = document.getElementById('toast');
            toast.innerText = 'Copied ' + filename;
            toast.style.opacity = '1';

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.style.opacity = '0';
            }, 1500);
        }

        // Using legacy execCommand to bypass strict iframe restrictions commonly found in web environments
        function copyText(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;

            // Move it off-screen to avoid visual layout shifts
            textarea.style.position = 'fixed';
            textarea.style.top = '-9999px';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);

            textarea.select();

            try {
                document.execCommand('copy');
            } catch (err) {
                console.error('Failed to copy text', err);
            } finally {
                document.body.removeChild(textarea);
            }
        }

        // Listen for keys 1 through 8
        document.addEventListener('keydown', (e) => {
            const key = e.key;

            // Check if key is between 1 and 8
            if (key >= '1' && key <= '8') {
                const dataSource = document.getElementById('data-' + key);

                if (dataSource) {
                    const codeBlock = dataSource.value;
                    const filename = dataSource.getAttribute('data-filename');

                    copyText(codeBlock);
                    showToast(filename);
                }
            }
        });
    </script>
</body>

</html>
